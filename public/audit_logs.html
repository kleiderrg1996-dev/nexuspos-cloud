<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría | NexusPOS</title>
    <link href="/css/output.css" rel="stylesheet">
    <link href="/css/theme.css" rel="stylesheet">
</head>

<body class="bg-gray-100 dark:bg-gray-900">
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-7xl mx-auto">
                <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Registro de Auditoría</h1>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">Historial de acciones sensibles
                            realizadas en el sistema.</p>
                    </div>
                </header>

                <!-- Tabla de Logs -->
                <div
                    class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead class="bg-gray-50 dark:bg-gray-700/50">
                                <tr>
                                    <th
                                        class="px-6 py-4 font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Fecha / Hora</th>
                                    <th
                                        class="px-6 py-4 font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Usuario</th>
                                    <th
                                        class="px-6 py-4 font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Acción</th>
                                    <th
                                        class="px-6 py-4 font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Entidad</th>
                                    <th
                                        class="px-6 py-4 font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">
                                        Detalles</th>
                                </tr>
                            </thead>
                            <tbody id="logs-table-body" class="divide-y divide-gray-100 dark:divide-gray-700">
                                <!-- Filas dinámicas -->
                            </tbody>
                        </table>
                    </div>
                    <div id="no-logs-msg" class="hidden p-12 text-center text-gray-500 dark:text-gray-400">
                        No hay registros de auditoría.
                    </div>
                    <!-- Paginación Simple -->
                    <div class="p-4 border-t border-gray-100 dark:border-gray-700 flex justify-between items-center">
                        <span id="logs-count" class="text-xs text-gray-500">Mostrando 0 registros</span>
                        <div class="flex gap-2">
                            <button id="prev-page"
                                class="px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm disabled:opacity-50">Anterior</button>
                            <button id="next-page"
                                class="px-4 py-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm disabled:opacity-50">Siguiente</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/audit_logs.js"></script>
</body>

</html>
