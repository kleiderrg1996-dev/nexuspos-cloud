<svg width="512" height="512" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square -->
  <rect width="100" height="100" rx="22" fill="#0d1b2a"/>
  <rect width="100" height="100" rx="22" fill="url(#bg_glow)" opacity="0.3"/>

  <!-- Grid lines hologram effect -->
  <path d="M30 20V80M50 20V80M70 20V80" stroke="#00e5ff" stroke-width="0.6" opacity="0.15"/>
  <path d="M10 40H90M10 55H90M10 70H90" stroke="#00e5ff" stroke-width="0.6" opacity="0.15"/>

  <!-- Cart body animated -->
  <path d="M22 30H28L40 64H72L80 38H42" stroke="url(#cart_grad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke" values="#00e5ff;#2979ff;#00e5ff" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Wheels -->
  <circle cx="43" cy="74" r="5.5" fill="none" stroke="#00e5ff" stroke-width="4">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="74" r="5.5" fill="none" stroke="#00e5ff" stroke-width="4">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
  </circle>

  <!-- Scan line -->
  <rect x="33" y="42" width="38" height="2.5" rx="1.5" fill="#00e5ff" opacity="0.5">
    <animate attributeName="y" values="42;57;42" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Border glow -->
  <rect width="100" height="100" rx="22" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.2"/>

  <defs>
    <linearGradient id="cart_grad" x1="20" y1="30" x2="80" y2="75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2979ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <radialGradient id="bg_glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#2979ff"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
