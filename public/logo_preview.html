<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NexusPOS Logo Preview</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap');

        body {
            background: #0a0f1f;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
            gap: 20px;
        }

        h1 {
            font-size: 2rem;
            letter-spacing: 0.1em;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }

        h2 {
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            margin: 30px 0 10px;
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 36px;
            margin-bottom: 20px;
        }

        .option {
            text-align: center;
            background: #131b2e;
            padding: 30px 25px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s;
        }

        .option:hover {
            transform: translateY(-5px);
            border-color: #2979ff;
        }

        .option h3 {
            margin: 16px 0 0;
            color: #2979ff;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
        }

        svg {
            width: 140px;
            height: 140px;
            transition: transform 0.3s ease;
        }

        .divider {
            width: 100%;
            max-width: 700px;
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>NexusPOS — Logos</h1>

    <h2>🛒 Carritos Futuristas</h2>
    <div class="grid">

        <div class="option">
            <h3>1. Cyber Cart</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#0d1b2a" />
                <rect width="100" height="100" rx="22" fill="url(#cg1)" opacity="0.2" />
                <!-- Cart handle -->
                <path d="M22 28H30L42 66H74L82 38H40" stroke="url(#cg1)" stroke-width="5.5" stroke-linecap="round"
                    stroke-linejoin="round" />
                <!-- Items in cart -->
                <path d="M47 42H70M47 50H65" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
                <!-- Wheels -->
                <circle cx="44" cy="75" r="5.5" stroke="url(#cg1)" stroke-width="3.5" />
                <circle cx="71" cy="75" r="5.5" stroke="url(#cg1)" stroke-width="3.5" />
                <!-- Glow lines -->
                <path d="M22 28H30" stroke="#00e5ff" stroke-width="5.5" stroke-linecap="round" />
                <defs>
                    <linearGradient id="cg1" x1="10" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#2979ff" />
                        <stop offset="1" stop-color="#00e5ff" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="option">
            <h3>2. Neon Speed Cart</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#060d1a" />
                <!-- Speed lines -->
                <path d="M10 46H22M8 52H18M12 58H20" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"
                    opacity="0.35" />
                <!-- Cart body -->
                <path d="M28 35H80L72 60H38L28 35Z" fill="url(#ng1)" opacity="0.15" />
                <path d="M28 35H80L72 60H38L28 35Z" stroke="url(#ng1)" stroke-width="5" stroke-linejoin="round"
                    stroke-linecap="round" />
                <!-- Handle -->
                <path d="M28 35L22 22" stroke="url(#ng1)" stroke-width="5" stroke-linecap="round" />
                <!-- Wheels -->
                <circle cx="42" cy="73" r="6" fill="none" stroke="#00e5ff" stroke-width="4">
                    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite" />
                </circle>
                <circle cx="70" cy="73" r="6" fill="none" stroke="#00e5ff" stroke-width="4">
                    <animate attributeName="stroke-opacity" values="1;0.5;1" dur="2.5s" repeatCount="indefinite"
                        begin="0.5s" />
                </circle>
                <defs>
                    <linearGradient id="ng1" x1="10" y1="20" x2="90" y2="80" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#7c3aed" />
                        <stop offset="0.5" stop-color="#2979ff" />
                        <stop offset="1" stop-color="#00e5ff" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="option">
            <h3>3. Hologram Cart</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="22" fill="#050c17" />
                <!-- Grid lines for hologram effect -->
                <path d="M30 20V80M50 20V80M70 20V80" stroke="#00e5ff" stroke-width="0.5" opacity="0.1" />
                <path d="M10 40H90M10 55H90M10 70H90" stroke="#00e5ff" stroke-width="0.5" opacity="0.1" />
                <!-- Cart outline -->
                <path d="M22 30H28L40 64H72L80 38H42" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <animate attributeName="stroke" values="#00e5ff;#2979ff;#00e5ff" dur="3s"
                        repeatCount="indefinite" />
                </path>
                <!-- Wheels -->
                <circle cx="43" cy="74" r="5" stroke="#00e5ff" stroke-width="3.5">
                    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
                </circle>
                <circle cx="70" cy="74" r="5" stroke="#00e5ff" stroke-width="3.5">
                    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"
                        begin="0.7s" />
                </circle>
                <!-- Scan line -->
                <rect x="33" y="42" width="38" height="2" rx="1" fill="#00e5ff" opacity="0.4">
                    <animate attributeName="y" values="42;55;42" dur="3s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite" />
                </rect>
            </svg>
        </div>
    </div>

    <div class="divider"></div>
    <h2>Opciones Anteriores</h2>
    <div class="grid">
        <div class="option">
            <h3>4. Nexus Node</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="url(#og1)" />
                <circle cx="50" cy="50" r="15" stroke="white" stroke-width="6" />
                <path d="M50 20V35M50 65V80M20 50H35M65 50H80" stroke="white" stroke-width="6" stroke-linecap="round" />
                <defs>
                    <linearGradient id="og1" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#2979ff" />
                        <stop offset="1" stop-color="#00e5ff" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="option">
            <h3>5. Nexus Diamond</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="url(#og2)" />
                <path d="M30 70V30L50 50L70 30V70" stroke="white" stroke-width="8" stroke-linecap="round"
                    stroke-linejoin="round" />
                <defs>
                    <linearGradient id="og2" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#1565c0" />
                        <stop offset="1" stop-color="#2979ff" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
        <div class="option">
            <h3>6. Smart Terminal</h3>
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="url(#og3)" />
                <path d="M50 25L25 45V75H75V45L50 25Z" stroke="white" stroke-width="6" stroke-linejoin="round" />
                <circle cx="50" cy="55" r="8" fill="white" />
                <defs>
                    <linearGradient id="og3" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#2196f3" />
                        <stop offset="1" stop-color="#00bcd4" />
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>
</body>

</html>
