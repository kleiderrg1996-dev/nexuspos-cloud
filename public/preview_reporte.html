<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vista Previa — Nuevo Reporte de Cuadre de Caja</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 {
      color: #fff;
      font-size: 28px;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      color: #8888aa;
      font-size: 14px;
      margin-bottom: 30px;
      text-align: center;
    }
    .preview-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      overflow: hidden;
      max-width: 800px;
      width: 100%;
    }
    .preview-container img {
      width: 100%;
      display: block;
    }
    .badge {
      display: inline-block;
      background: #10b981;
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🎨 Vista Previa — Nuevo Reporte de Cuadre de Caja</h1>
  <p class="subtitle">Así quedará el PDF profesional con datos de ejemplo</p>
  <span class="badge">✨ DISEÑO PROPUESTO</span>
  <br><br>
  <div class="preview-container">
    <img src="/images/preview_cuadre.png" alt="Vista previa del reporte de cuadre de caja">
  </div>
</body>
</html>
