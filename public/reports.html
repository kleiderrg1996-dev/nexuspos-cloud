<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes | NexusPOS</title>
  <link href="/css/output.css" rel="stylesheet">
  <link href="/css/theme.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark-mode');
    }
  </script>

  <div class="flex-1 flex flex-col h-screen">
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <h1 class="text-3xl font-bold text-gray-800 mb-6">
        Reporte de Ventas
      </h1>

      <div class="card-nexus p-8 shadow-xl mb-8 animate-slide-up">
        <div
          class="flex flex-wrap items-end gap-3 p-6 bg-gray-50 dark:bg-gray-800/50 rounded-nexus-lg border border-gray-100 dark:border-gray-700">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Desde</label>
            <input type="date" id="filter-start-date" class="input-text block w-full text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase mb-1 ml-1">Hasta</label>
            <input type="date" id="filter-end-date" class="input-text block w-full text-sm">
          </div>
          <button id="btn-filter"
            class="px-6 py-2.5 bg-blue-600 text-white rounded-full font-bold hover:bg-blue-700 transition-all shadow-md active:scale-95">
            Filtrar
          </button>

          <div class="flex gap-2 ml-auto">
            <button id="btn-download-pdf" title="Descargar PDF"
              class="p-2.5 bg-red-500 text-white rounded-2xl hover:bg-red-600 transition-all shadow-md active:scale-95">
              <svg class="w-5 h-5 text-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
              </svg>
            </button>
            <button id="btn-download-excel" title="Descargar Excel"
              class="p-2.5 bg-green-600 text-white rounded-2xl hover:bg-green-700 transition-all shadow-md active:scale-95">
              <svg class="w-5 h-5 text-current" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Botones Rápidos de Fecha -->
        <div class="flex flex-wrap gap-2 mt-2">
          <button
            class="btn-quick-date text-[10px] px-2 py-1 bg-white border border-gray-200 rounded-full hover:bg-gray-100 transition-colors text-gray-600"
            data-range="today">Hoy</button>
          <button
            class="btn-quick-date text-[10px] px-2 py-1 bg-white border border-gray-200 rounded-full hover:bg-gray-100 transition-colors text-gray-600"
            data-range="yesterday">Ayer</button>
          <button
            class="btn-quick-date text-[10px] px-2 py-1 bg-white border border-gray-200 rounded-full hover:bg-gray-100 transition-colors text-gray-600"
            data-range="last7">Últimos 7 días</button>
          <button
            class="btn-quick-date text-[10px] px-2 py-1 bg-white border border-gray-200 rounded-full hover:bg-gray-100 transition-colors text-gray-600"
            data-range="thisMonth">Mes Actual</button>
        </div>
      </div>

      <div id="report-summary-cards" class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8 hidden">
        <div class="card-nexus p-5 shadow-lg animate-slide-up delay-100">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Ingresos Totales</h3>
          <p id="summary-total-sales" class="mt-2 text-3xl font-bold text-gray-900 indicator-val">0.00 Bs</p>
          <p id="summary-total-sales-usd" class="text-sm text-gray-600">(0.00 $)</p>
        </div>
        <div class="card-nexus p-5 shadow-lg animate-slide-up delay-200">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Costo Mercancía</h3>
          <p id="summary-total-cost" class="mt-2 text-3xl font-bold text-gray-900 indicator-val">0.00 Bs</p>
          <p id="summary-total-cost-usd" class="text-sm text-gray-600">(0.00 $)</p>
        </div>
        <div
          class="card-nexus p-5 shadow-lg border-2 border-green-500 dark:border-green-500 animate-slide-up delay-300">
          <h3 class="text-sm font-bold text-green-700 dark:text-green-400 uppercase tracking-wider">Ganancia Neta</h3>
          <p id="summary-total-profit" class="mt-2 text-3xl font-bold text-green-600 indicator-val">0.00 Bs</p>
          <p id="summary-total-profit-usd" class="text-sm text-green-600 font-medium">(0.00 $)</p>
        </div>
        <div class="card-nexus p-5 shadow-lg animate-slide-up delay-400">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider">Total Fiado</h3>
          <p id="summary-total-fiado" class="mt-2 text-3xl font-bold text-gray-900 indicator-val">0.00 Bs</p>
          <p id="summary-total-fiado-usd" class="text-sm text-gray-500">(0.00 $)</p>
        </div>
      </div>

      <div class="card-nexus shadow-xl overflow-hidden border border-gray-100 animate-fade-in delay-500">
        <div class="p-6 md:p-8 border-b border-gray-100">
          <div class="flex flex-col md:flex-row justify-between items-center space-y-3 md:space-y-0">
            <h2 class="text-2xl font-bold text-gray-800 mb-0">
              Detalle de Ventas
            </h2>
            <div class="relative w-full md:w-1/3">
              <span class="absolute inset-y-0 left-0 flex items-center pl-4">
                <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke-width="2" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </span>
              <input type="text" id="report-search-input" placeholder="Buscar en resultados..."
                class="input-text pl-11 pr-4 py-3 w-full text-sm">
            </div>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Fecha</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                  ID</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Usuario</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Detalle</th>
                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Total (Bs)</th>
                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Costo (Bs)</th>
                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Ganancia (Bs)</th>
                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                  Acciones</th>
              </tr>
            </thead>
            <tbody id="report-table-body" class="bg-white divide-y divide-gray-200">
              <tr>
                <td colspan="8" class="px-6 py-4 text-center text-gray-500">
                  Seleccione un rango de fechas y genere un reporte.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/reports.js"></script>
</body>

</html>
